apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: customer-billing-review-agent
  description: Conversational AI agent for Barton Industrial Supply that helps billing specialists review customer billing and contractual payment information, compare payment behavior against contract terms, and generate Customer Billing Review Summaries.

provides:
  apis:
    - name: customer-billing-review-agent
      kind: a2a
      ordId: customer.build:apiResource:customer-billing-review-agent-bf3a8.customer-billing-review-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-ce-billingdocument-0001-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:customer-billing-review-agent-bf3a8.sap-s4-ce-billingdocument-0001-mcp-server:v1
  - name: sap-s4-api-cabuspartpayment-0002-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:customer-billing-review-agent-bf3a8.sap-s4-api-cabuspartpayment-0002-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
